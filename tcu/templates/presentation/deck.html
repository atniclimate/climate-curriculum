<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>
__FONTS__
:root{color-scheme:dark;--base:#010B13;--raised:#141414;--overlay:#1E242C;--text:#E8ECF0;--white:#FFFFFF;--muted:#9AA4B5;--drop:#4E5763;--hair:rgba(232,236,240,.14);--red:#E13D33;--red-dk:#F26B5E;--magenta-dk:#D7A6E8;--water-hi:#9CC7F0;
--f-display:"League Spartan","Century Gothic",Arial,sans-serif;--f-body:"Lexend Deca","Segoe UI",system-ui,sans-serif;--f-data:"Cascadia Code","SF Mono",Consolas,monospace;
--b:clamp(15px,min(calc(.9vw + 5px),calc(1.7vh + 4px)),24px);--gutter:clamp(16px,4.5vw,72px)}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--base);color:var(--text);font-family:var(--f-body);font-size:var(--b);line-height:1.55}
button{font:inherit;color:inherit}a{color:var(--red-dk)}
:focus-visible{outline:2px solid var(--red-dk);outline-offset:3px}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:12px;padding:8px var(--gutter);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.bar .nm{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool{background:transparent;border:1px solid var(--hair);padding:6px 11px;min-height:44px;min-width:44px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--text);color:var(--base)}
.clock{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(20px,5vh,56px) var(--gutter)}
.slide .in{max-width:1180px;margin:0 auto;display:grid;gap:clamp(10px,2vh,22px)}
.slide.hall .in{min-height:100%;align-content:center}
.k{font-family:var(--f-display);font-weight:600;font-size:max(12px,calc(var(--b)*.62));letter-spacing:.16em;text-transform:uppercase;color:var(--red-dk)}
h1,h2,h3{font-family:var(--f-display);color:var(--white);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:calc(var(--b)*2.5);letter-spacing:-.02em}h2{font-size:calc(var(--b)*1.7)}h3{font-size:calc(var(--b)*1.15)}
p,li{max-width:66ch;margin:0 0 .5em}
.big p{font-size:calc(var(--b)*1.3);line-height:1.4;color:var(--white)}
table{border-collapse:collapse;font-size:calc(var(--b)*.8)}th,td{border:1px solid var(--hair);padding:5px 9px;text-align:left;vertical-align:top}th{background:var(--overlay);font-family:var(--f-display)}
.mk{border:1.5px dashed currentColor;padding:1px 6px;font-size:.92em;-webkit-box-decoration-break:clone;box-decoration-break:clone}.mk b{font-family:var(--f-display);font-size:.72em;letter-spacing:.12em;text-transform:uppercase;margin-right:.4em}
.mk-local{color:var(--water-hi)}.mk-confirm{color:var(--magenta-dk)}.mk-place{color:var(--muted)}.mk-voice,.mk-verify{color:var(--red-dk)}
.mk-unknown{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(154,164,181,.28) 6px 8px)}
.socket{border-left:4px solid var(--water-hi);padding:4px 16px;background:var(--raised)}
.vlab{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.14em;padding:2px 8px;background:var(--text);color:var(--base)}
figure{margin:0}figure svg{width:100%;max-height:52vh;height:auto}figcaption{font-size:13px;color:var(--muted)}
.draft{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--white);background:var(--red);padding:3px 10px;justify-self:start}
.notes{max-height:34vh;overflow:auto;border-top:2px solid var(--red);background:var(--raised);padding:12px var(--gutter);font-size:15px}
.nav{display:flex;gap:8px;align-items:center;padding:6px var(--gutter);border-top:1px solid var(--hair)}
.nav .count{font-family:var(--f-data);font-size:13px;color:var(--muted);margin-right:auto}
.notes-src{display:none}
body.hl .slide p,body.hl .slide li,body.hl .slide td{color:var(--drop)}
body.hl .slide strong,body.hl .slide .mk,body.hl .slide h1,body.hl .slide h2{color:var(--white)}
@media (prefers-reduced-motion:no-preference){.slide{animation:fade .4s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}}
@media print{.bar,.nav,.notes{display:none}.slide{position:static;page-break-after:always;display:block!important}body{background:#fff;color:#000}h1,h2,h3{color:#000}}
</style>
</head>
<body>
<div class="app">
<div class="bar"><span class="nm">__TITLE__</span>
<span class="clock" aria-live="off"><span id="elapsed">0:00</span></span>
<button class="tool" id="notesBtn" aria-pressed="false" title="Speaker notes (N)">Notes</button>
<button class="tool" id="timerBtn" aria-pressed="false" title="Clock (T)">Clock</button>
<button class="tool" id="hlBtn" aria-pressed="false" title="Highlight pass (H)">Highlight</button>
</div>
<main class="stage" id="stage" aria-live="polite">
__SLIDES__
</main>
<div class="notes" id="notes" hidden aria-label="Speaker notes"></div>
<div class="nav"><span class="count" id="count"></span>
<button class="tool" id="prev" aria-label="Previous slide">Back</button>
<button class="tool" id="next" aria-label="Next slide">Next</button></div>
</div>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide')),cur=0,$=function(i){return document.getElementById(i)};
  var notes=$('notes');
  function go(i){
    i=Math.max(0,Math.min(slides.length-1,i));cur=i;
    slides.forEach(function(s,k){s.hidden=k!==i});
    var s=slides[i];s.scrollTop=0;
    $('count').textContent=(i+1)+' / '+slides.length+' · '+(s.getAttribute('data-part')||'');
    var n=s.querySelector('.notes-src');notes.innerHTML=n?n.innerHTML:'';
    $('prev').disabled=i===0;$('next').disabled=i===slides.length-1;
    try{history.replaceState(null,'','#'+(i+1))}catch(e){}
  }
  function toggleNotes(){notes.hidden=!notes.hidden;$('notesBtn').setAttribute('aria-pressed',String(!notes.hidden))}
  function toggleHL(){document.body.classList.toggle('hl');$('hlBtn').setAttribute('aria-pressed',String(document.body.classList.contains('hl')))}
  var t0=null,acc=0,tick=null;
  function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
  function paint(){$('elapsed').textContent=fmt(acc+(t0?(Date.now()-t0)/1000:0))}
  function toggleTimer(){if(t0){acc+=(Date.now()-t0)/1000;t0=null;clearInterval(tick);$('timerBtn').setAttribute('aria-pressed','false')}else{t0=Date.now();tick=setInterval(paint,500);$('timerBtn').setAttribute('aria-pressed','true')}paint()}
  $('notesBtn').onclick=toggleNotes;$('hlBtn').onclick=toggleHL;$('timerBtn').onclick=toggleTimer;
  $('prev').onclick=function(){go(cur-1)};$('next').onclick=function(){go(cur+1)};
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();if(tag==='textarea'||tag==='input')return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&tag!=='button')){e.preventDefault();go(cur+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
    else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);
    else if(e.key==='n'||e.key==='N')toggleNotes();else if(e.key==='t'||e.key==='T')toggleTimer();else if(e.key==='h'||e.key==='H')toggleHL();
  });
  var sx=null,sy=null,st=$('stage');
  st.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  st.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));sx=null},{passive:true});
  var h=parseInt((location.hash||'#1').slice(1),10);go(isNaN(h)?0:h-1);
})();
</script>
</body>
</html>
