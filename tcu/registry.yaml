# TCU template build: site registry (public facts only)
# 40 sites: 35 Tribal Colleges and Universities as Patrick listed them on 10/15/2026
# (planning/tcu/LAUNCH-TCU-TEMPLATES.md, Appendix A) and 5 Northwest Indian College
# extended campus sites (Appendix B). Names are kept exactly as given, diacritics
# included. Nothing here speaks for any institution or Nation.
#
# Sources (all public):
# - coordinates: NCES IPEDS HD2024 directory file, LATITUDE and LONGITUD (the
#   geocoded institution address), downloaded 10/15/2026; or the U.S. Census
#   Geocoder for an address given in Appendix B, opened 10/15/2026. Otherwise
#   "unknown". A town_point is a Census 2024 Gazetteer place internal point,
#   used only to place the climate unit, never presented as the campus.
# - county and climate unit: point-in-polygon against Census TIGER 2024 AIANNH
#   and Census GENZ 2024 counties, read from H:/raw-data (read only).
# - climate unit rule (launch prompt): the AIANNH area in
#   H:/raw-data/climate-projections/cache that contains the campus; if none, the
#   campus county, with LOCA2 from H:/raw-data/loca2 if that county exists there,
#   otherwise "no projection in raw-data" (unknown).
# A climate unit names a public data geography. It is a view of public data, not
# a Nation's voice, and any profile built on it stays in private/ until the TCU
# and, where it applies, the chartering Nation review it.
# Differences from public lists (IPEDS Tribal flag; AIHEC's member page) are
# recorded for Patrick in the run ledger; no site is added or dropped here.
# status: draft for every site until TCU review.
